# /etc/nginx/conf.d/chapter-agent.conf
# 静态前端 + /api 反代到本机后端（同源，无 CORS 问题）
server {
    listen 80;
    server_name _;                # 有域名后改成你的域名
    client_max_body_size 82m;     # 为 multipart 元数据预留空间，正文仍由后端限制为 80MB
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    # 前端静态文件
    root /opt/chapter-agent/frontend/dist;
    index index.html;

    # 后端 API 反代（分析可能持续数分钟，放宽超时）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 静态演示数据
    location /static-data/ {
        try_files $uri =404;
        expires 1h;
    }

    # SPA 路由回退
    location / {
        try_files $uri /index.html;
    }
}
